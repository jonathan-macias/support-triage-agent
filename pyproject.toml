[project]
name = "support-triage-agent"
version = "0.1.0"
description = "AI agent that triages customer support tickets (FastAPI + Pydantic AI + MCP)"
authors = [
    { name = "Jonathan Macías", email = "jemacias565@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "pg8000>=1.31.5",
    "pydantic-ai-slim[google]>=2.56.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
